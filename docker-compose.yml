# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Services ─────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      # Persist database files across container restarts
      - postgres_data:/var/lib/postgresql/data

    ports:
      # Expose to host only in development; map 5433 to avoid conflict with local DB
      - "5433:5432"

    # Healthcheck: pg_isready ensures the DB is truly accepting connections
    # before the app container attempts to connect or run migrations.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production       # Always build the lean production stage
    container_name: hospital_app
    restart: unless-stopped

    # Pass every variable from your .env file directly into the container
    env_file:
      - .env

    # Override / supplement specific variables to use the Docker service name
    # as the DB host instead of 'localhost'.
    environment:
      NODE_ENV: production
      DB_HOST: db               # ← must match the service name above
      DB_PORT: 5432

    ports:
      - "${PORT:-3000}:3000"

    # Do NOT start the app until PostgreSQL passes its healthcheck
    depends_on:
      db:
        condition: service_healthy

    # Optional: mount logs directory so you can inspect them on the host
    # volumes:
    #   - ./logs:/app/logs
